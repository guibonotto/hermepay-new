name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      
      # 1. CORREÇÃO DA VERSÃO DO NODE.JS
      - name: Set up Node.js version 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # A CHAVE DO SEU APP (Deixe como o Azure criou)
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_MEADOW_060F7770F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Necessário para o Action
          
          # 2. CORREÇÃO DO ERRO "deployment_action was not provided"
          action: "upload" 

          # Configurações do seu projeto
          app_location: "/hermepay-frontend"
          api_location: ""
          output_location: "dist/hermepay-frontend/browser"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_MEADOW_060F7770F }}
          action: "close"