<div class="auth-container">
  <div class="auth-box">
    <h2 class="auth-title">Login Herme Pay</h2>
    <p class="auth-subtitle">Acesse seu dashboard para gerenciar suas vendas.</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <div class="form-field">
        <label for="email">E-mail</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="voce@seuemail.com"
          [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        >
        <small *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-text">
          Insira um e-mail válido.
        </small>
      </div>

      <div class="form-field">
        <label for="password">Senha</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          placeholder="••••••••"
          [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        >
        <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-text">
          A senha é obrigatória.
        </small>
      </div>

      <div *ngIf="error" class="alert alert-error">
        {{ error }}
      </div>

      <button type="submit" class="btn-submit" [disabled]="loginForm.invalid">
        Entrar
      </button>
    </form>
    
    <div class="auth-footer">
      <p>Não tem uma conta? <a routerLink="/register">Cadastre-se</a></p>
    </div>
  </div>
</div>
